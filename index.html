<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>UBH Patient Monitor</title>
<style>
  /* colours - TODO swap for the actual mantine theme values */
  :root {
    --ubhRed-6: #b5302f;  --ubhRed-7: #941f1f;
    --ubhBlue-6: #2f6fd6;
    --ubhNeutral-2: #eceef1; --ubhNeutral-3: #dee2e6; --ubhNeutral-4: #ced4da;
    --ubhNeutral-7: #6b7280; --ubhNeutral-8: #4b5563; --ubhNeutral-9: #1f2937;
    --success-bg2: #dcfce7; --success-text: #166534;
    --error-bg: #fee2e2; --error-text: #991b1b;
    --page-bg: #f4f5f7; --card-bg: #ffffff;
    --radius-md: 10px; --radius-lg: 16px; --radius-xl: 999px;
    --trace-rpm: #4b5563; --trace-flow: var(--ubhBlue-6); --trace-pul: var(--ubhRed-6);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--page-bg); color: var(--ubhNeutral-9);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "PingFang SC", sans-serif; }
  body { min-height: 100dvh; }
  .page { display: flex; flex-direction: column; gap: 20px; max-width: 1200px; margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)); }

  /* mostly copied from PatientDetail.css */
  .logo { display: block; height: 40px; width: 120px; }
  .detail-header { display: flex; align-items: center; gap: 15px; justify-content: space-between; }
  .detail-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .detail-title h3 { font-size: 22px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .patient-id-accent { color: var(--ubhRed-7); font-weight: 700; }
  .icon-btn { width: 36px; height: 36px; border: 0; background: transparent; border-radius: var(--radius-md);
    display: grid; place-items: center; color: var(--ubhNeutral-9); flex-shrink: 0; }
  .detail-tabs { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .detail-tabs::-webkit-scrollbar { display: none; }
  .btn { flex-shrink: 0; font: inherit; font-size: 14px; font-weight: 600; padding: 9px 16px; border-radius: var(--radius-md);
    border: 1px solid var(--ubhRed-7); white-space: nowrap; pointer-events: none; }
  .btn.default { background: var(--ubhRed-7); color: #fff; }
  .btn.outlined { background: transparent; color: var(--ubhRed-7); }

  .sensor-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .sensor-grid .card:first-child { grid-column: 1 / -1; }
  @media (max-width: 900px) { .sensor-grid { grid-template-columns: 1fr; } }
  .card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 18px 18px 14px;
    border: 1px solid var(--ubhNeutral-3); display: flex; flex-direction: column; gap: 10px; }
  .sensor-card-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sensor-card-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .sensor-card-title h4 { font-size: 17px; font-weight: 600; white-space: nowrap; }
  .info-icon { border: 0; background: transparent; color: var(--ubhNeutral-7); display: grid; place-items: center; cursor: help; padding: 2px; }
  .info-text { font-size: 13px; line-height: 1.4; color: var(--ubhNeutral-8); background: var(--ubhNeutral-2);
    border-radius: var(--radius-md); padding: 8px 10px; display: none; }
  .info-text.open { display: block; }
  .live-val { font-variant-numeric: tabular-nums; font-size: 24px; font-weight: 700; line-height: 1; white-space: nowrap; }
  .live-val small { font-size: 12px; font-weight: 500; color: var(--ubhNeutral-7); margin-left: 4px; }

  .chart { display: grid; grid-template-columns: 44px 1fr; grid-template-rows: 1fr 18px; height: 170px; margin-top: 14px; }
  .y-axis { position: relative; font-size: 11px; color: var(--ubhNeutral-8); }
  .y-axis span { position: absolute; right: 8px; transform: translateY(-50%); font-variant-numeric: tabular-nums; }
  .plot { position: relative; border-left: 1px solid var(--ubhNeutral-8); border-bottom: 1px solid var(--ubhNeutral-8); }
  .plot canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .x-axis { grid-column: 2; position: relative; }
  .x-axis canvas { position: absolute; inset: 0; width: 100%; height: 100%; }

  .status { font-size: 13px; font-weight: 600; white-space: nowrap; }
  .status.good { color: var(--success-text); }
  .status.bad { color: var(--error-text); }
  .foot { font-size: 12px; color: var(--ubhNeutral-7); text-align: center; }
  @media (max-width: 600px) {          /* phones - squish so all 3 graphs fit */
    .page { gap: 12px; padding-left: 12px; padding-right: 12px; }
    .detail-title h3 { font-size: 18px; }
    .icon-btn { width: 28px; height: 28px; }
    .logo { height: 32px; width: 96px; }
    .btn { font-size: 12px; padding: 6px 11px; }
    .detail-tabs { gap: 8px; }
    .sensor-grid { gap: 12px; }
    .card { padding: 12px 12px 8px; gap: 6px; border-radius: 12px; }
    .sensor-card-title h4 { font-size: 15px; }
    .live-val { font-size: 20px; }
    .chart { height: 128px; grid-template-columns: 38px 1fr; margin-top: 10px; }
    .status { font-size: 12px; }
  }
</style>
</head>

7.636719 C 67.835938 -65.589844 54.164062 -74.261719 38.046875 -74.261719 C 17.035156 -74.261719 2.855469 -59.777344 2.855469 -36.316406 C 2.855469 -12.851562 17.339844 1.632812 38.046875 1.632812 Z M 38.046875 1.632812" fill="#941f1f"/></g></g><g transform="translate(1130.695214, 950.869242)"><g/></g><g transform="translate(1149.870886, 950.869242)"><g><path d="M 53.453125 -43.457031 L 19.6875 -43.457031 L 19.6875 -72.628906 L 5.917969 -72.628906 L 5.917969 0 L 19.6875 0 L 19.6875 -31.113281 L 53.453125 -31.113281 L 53.453125 0 L 67.222656 0 L 67.222656 -72.628906 L 53.453125 -72.628906 Z M 53.453125 -43.457031" fill="#941f1f"/></g></g><g transform="translate(1220.148544, 950.869242)"><g><path d="M 59.46875 -72.628906 L 5.917969 -72.628906 L 5.917969 0 L 59.265625 0 L 59.265625 -12.34375 L 19.6875 -12.34375 L 19.6875 -31.316406 L 55.695312 -31.316406 L 55.695312 -43.148438 L 19.6875 -43.148438 L 19.6875 -60.285156 L 59.46875 -60.285156 Z M 59.46875 -72.628906" fill="#941f1f"/></g></g><g transform="translate(1278.492122, 950.869242)"><g><path d="M 72.527344 0 L 44.375 -72.628906 L 28.257812 -72.628906 L 0.613281 0 L 14.792969 0 L 20.402344 -16.015625 L 52.226562 -16.015625 L 57.941406 0 Z M 27.339844 -35.601562 C 29.785156 -42.230469 33.253906 -51.921875 36.210938 -60.492188 C 39.171875 -51.921875 42.640625 -42.230469 45.1875 -35.601562 L 48.046875 -27.746094 L 24.582031 -27.746094 Z M 27.339844 -35.601562" fill="#941f1f"/></g></g><g transform="translate(1347.545674, 950.869242)"><g><path d="M 62.835938 -19.28125 C 62.53125 -26.828125 60.386719 -32.234375 52.328125 -34.785156 C 60.183594 -37.539062 64.46875 -43.761719 64.46875 -52.125 C 64.46875 -64.367188 55.59375 -72.628906 38.863281 -72.628906 L 5.917969 -72.628906 L 5.917969 0 L 19.6875 0 L 19.6875 -28.460938 L 37.640625 -28.460938 C 44.984375 -28.460938 48.863281 -25.910156 49.269531 -16.628906 L 49.574219 -8.671875 C 49.675781 -5.101562 50.1875 -2.140625 51.515625 0 L 65.691406 0 C 64.265625 -2.140625 63.550781 -5.304688 63.449219 -8.464844 Z M 19.6875 -61.304688 L 37.539062 -61.304688 C 45.496094 -61.304688 50.289062 -57.734375 50.289062 -50.597656 C 50.289062 -43.148438 45.496094 -39.273438 38.046875 -39.273438 L 19.6875 -39.273438 Z M 19.6875 -61.304688" fill="#941f1f"/></g></g><g transform="translate(1409.6631, 950.869242)"><g><path d="M 1.632812 -72.628906 L 1.632812 -60.285156 L 24.890625 -60.285156 L 24.890625 0 L 38.761719 0 L 38.761719 -60.285156 L 62.019531 -60.285156 L 62.019531 -72.628906 Z M 1.632812 -72.628906" fill="#941f1f"/></g></g></g></svg>
  <div class="detail-header">
    <div class="detail-title">
      <span class="icon-btn" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      </span>
      <h3>Patient ID: <span class="patient-id-accent">MCL-01</span></h3>
    </div>
    <span id="pill" class="status bad">Connection Not Found</span>
  </div>

  <div class="detail-tabs" aria-hidden="true">
    <span class="btn default">Live Sensor Data</span>
  </div>

  <div id="channels" class="sensor-grid"></div>
  <div class="foot" id="foot">UNSW Bionic Hearts: Made for life</div>
</div>

<script>
(() => {
  // same order as data.json
  const CFG = [
    { color:"--trace-rpm",  sigma:2,    dec:0, ticks:4,
      info:"Speed of the pump motor." },
    { color:"--trace-flow", sigma:0.015, dec:2, ticks:4,
      info:"Blood volume moved per minute. Watch for sudden drops or spikes." },
    { color:"--trace-pul",  sigma:0.06, dec:1, ticks:4,
      info:"Pressure in the pulmonary artery. Normal is around 10-20 mmHg." },
  ];
  const SWEEP_S = 8;      // how many secs show on the graph
  const TICK_S = 2;       // x axis label every 2s
  const RAMP_S = 2.0;     // ramp up time when pump starts

  const CID = Math.random().toString(36).slice(2, 12);
  let DATA = null, started = false, startMs = 0;
  let offset = 0, bestRtt = Infinity;   // so every phone is in sync w the server
  const nowLocal = () => performance.timeOrigin + performance.now();
  const serverNow = () => nowLocal() + offset;

  function apply(s) {
    if (!s) return;
    const was = started;
    started = !!s.started; startMs = s.startMs || 0;
    if (was !== started) {
      document.getElementById("pill").textContent = started ? "TAH connected" : "Connection Not Found";
      document.getElementById("pill").className = "status " + (started ? "good" : "bad");
    }
  }
  async function poll() {
    try {
      const t0 = performance.now();
      const r = await fetch("/state?id=" + CID + "&_=" + Date.now(), { cache: "no-store" });
      const t1 = performance.now();
      const s = await r.json();
      const rtt = t1 - t0;
      bestRtt *= 1.05;
      if (rtt < bestRtt) { bestRtt = rtt; offset = s.now - (performance.timeOrigin + (t0 + t1) / 2); }
      apply(s);
    } catch (e) {}
  }
  function sse() {
    if (!window.EventSource) return;
    const es = new EventSource("/events");
    es.onmessage = e => { try { apply(JSON.parse(e.data)); } catch (_) {} };
  }

  // fake noise based on time so the line doesnt flicker when it redraws
  function hh(n, s) { let x = Math.imul((n | 0) ^ Math.imul(s, 0x9E3779B1), 0x85EBCA6B);
    x ^= x >>> 13; x = Math.imul(x, 0xC2B2AE35); x ^= x >>> 16; return (x >>> 0) / 4294967296; }
  function noise(ch, tMs) {
    const k = Math.floor(tMs / 40), sd = 17 + ch * 101;
    return CFG[ch].sigma * (hh(k, sd) + hh(k, sd + 1) + hh(k, sd + 2) - 1.5) * 1.414;
  }
  function ramp(e) { if (e >= RAMP_S) return 1; const x = e / RAMP_S; return x * x * (3 - 2 * x); }

  function valueAt(ch, tMs, noisy) {
    if (!DATA) return 0;
    const lo = DATA.channels[ch].lo;                 // flatline at the bottom
    if (!started || tMs < startMs) return lo;
    const e = (tMs - startMs) / 1000;
    const v = DATA.channels[ch].v, N = v.length;
    let f = (e * DATA.fs * (DATA.speed || 1)) % N;   // sped up to 60bpm
    const i = Math.floor(f); f -= i;
    const base = v[i] * (1 - f) + v[(i + 1) % N] * f;
    const env = ramp(e);
    return lo + env * (base + (noisy ? noise(ch, tMs) : 0) - lo);
  }

  const traces = [];
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const fmtTick = (v, span) => span >= 100 ? Math.round(v) : span >= 5 ? v.toFixed(0) : v.toFixed(1);
  const INFO_SVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>';

  function makeUI() {
    const root = document.getElementById("channels");
    DATA.channels.forEach((c, k) => {
      const el = document.createElement("div");
      el.className = "card sensor-card";
      el.innerHTML = `
        <div class="sensor-card-header">
          <div class="sensor-card-title"><h4>${c.name}</h4>
            <button class="info-icon" type="button" aria-label="About ${c.name}">${INFO_SVG}</button></div>
          <div class="live-val" style="color:var(${CFG[k].color})"><span>--</span><small>${c.unit}</small></div>
        </div>
        <div class="info-text">${CFG[k].info}</div>
        <div class="chart">
          <div class="y-axis"></div>
          <div class="plot"><canvas class="grid"></canvas><canvas class="trace"></canvas></div>
          <div class="x-axis"><canvas></canvas></div>
        </div>`;
      root.appendChild(el);
      el.querySelector(".info-icon").onclick = () => el.querySelector(".info-text").classList.toggle("open");
      const yax = el.querySelector(".y-axis");
      const n = CFG[k].ticks, span = c.hi - c.lo;
      for (let i = 0; i <= n; i++) {
        const v = c.lo + span * i / n;
        const s = document.createElement("span");
        s.style.top = (100 - i * 100 / n) + "%";
        s.textContent = fmtTick(v, span);
        yax.appendChild(s);
      }
      const cv = el.querySelector("canvas.trace"), gv = el.querySelector("canvas.grid"), xv = el.querySelector(".x-axis canvas");
      traces.push({ k, cv, gv, xv, ctx: cv.getContext("2d"), gctx: gv.getContext("2d"), xctx: xv.getContext("2d"),
        val: el.querySelector(".live-val span"), w: 0, h: 0 });
    });
    resize();
    addEventListener("resize", resize);
    if (window.ResizeObserver) {          // redraw when the info box opens
      let raf = 0;
      const ro = new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(resize); });
      traces.forEach(t => ro.observe(t.cv.parentElement));
    }
  }
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    for (const t of traces) {
      const r = t.cv.getBoundingClientRect();
      t.w = r.width; t.h = r.height;
      for (const [cv, ctx] of [[t.cv, t.ctx], [t.gv, t.gctx]]) {
        cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      // dashed grid (same look as recharts)
      const g = t.gctx, n = CFG[t.k].ticks;
      g.clearRect(0, 0, t.w, t.h);
      g.strokeStyle = css("--ubhNeutral-3"); g.lineWidth = 1; g.setLineDash([3, 3]);
      g.beginPath();
      for (let i = 1; i < n; i++) { const y = Math.round(t.h * i / n) + 0.5; g.moveTo(0, y); g.lineTo(t.w, y); }
      g.stroke();
      const xr = t.xv.getBoundingClientRect();
      t.xw = xr.width; t.xh = xr.height;
      t.xv.width = Math.round(xr.width * dpr); t.xv.height = Math.round(xr.height * dpr);
      t.xctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      t.color = css(CFG[t.k].color); t.gridColor = css("--ubhNeutral-3"); t.axisColor = css("--ubhNeutral-8");
    }
  }
  const yOf = (t, v) => {
    const c = DATA.channels[t.k];
    const y = t.h - (v - c.lo) / (c.hi - c.lo) * t.h;
    return Math.min(t.h - 2, Math.max(2, y));
  };

  const T0 = Date.now();
  const fmtT = sec => sec < 60 ? sec + "s" : Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");

  // newest data on the right, scrolls left
  function draw(t, now) {
    const W = t.w, H = t.h; if (!W) return;
    const ctx = t.ctx, winMs = SWEEP_S * 1000, t0 = now - winMs;
    ctx.clearRect(0, 0, W, H);
    // vertical lines + time labels
    const ref = started ? startMs : T0, step = TICK_S * 1000;
    const x = t.xctx; x.clearRect(0, 0, t.xw, t.xh);
    x.fillStyle = t.axisColor; x.font = "11px " + getComputedStyle(document.body).fontFamily; x.textBaseline = "top";
    ctx.save(); ctx.strokeStyle = t.gridColor; ctx.lineWidth = 1; ctx.setLineDash([3, 3]); ctx.beginPath();
    for (let k = Math.ceil((t0 - ref) / step); ref + k * step <= now; k++) {
      const px = (ref + k * step - t0) / winMs * W;
      ctx.moveTo(Math.round(px) + 0.5, 0); ctx.lineTo(Math.round(px) + 0.5, H);
      if (k >= 0 && started) {
        const lab = fmtT(k * TICK_S), tw = x.measureText(lab).width;
        x.fillText(lab, Math.min(Math.max(px - tw / 2, 0), t.xw - tw), 3);
      }
    }
    ctx.stroke(); ctx.restore();
    ctx.strokeStyle = t.color; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.setLineDash([]);
    // sample on a fixed time grid so the line just slides left instead of wobbling every frame
    const DT = 40;
    ctx.beginPath();
    let first = true;
    for (let ts = Math.floor(t0 / DT) * DT; ts <= now; ts += DT) {
      const px = (ts - t0) / winMs * W, y = yOf(t, valueAt(t.k, ts, true));
      first ? ctx.moveTo(px, y) : ctx.lineTo(px, y);
      first = false;
    }
    ctx.stroke();
  }

  function frame() {
    const now = serverNow();
    for (const t of traces) draw(t, now);
    requestAnimationFrame(frame);
  }

  function readouts() {
    const now = serverNow();
    for (const t of traces) {
      if (!started || now < startMs) { t.val.textContent = "--"; continue; }
      let s = 0; for (let i = 0; i < 20; i++) s += valueAt(t.k, now - i * 50, false);  // avg over 1s
      t.val.textContent = (s / 20).toFixed(CFG[t.k].dec);
    }
  }

  // stop phones going to sleep
  async function wake() { try { await navigator.wakeLock.request("screen"); } catch (e) {} }
  document.addEventListener("click", wake, { once: true });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { wake(); poll(); } });

  async function boot() {
    for (let i = 0; i < 5; i++) await poll();
    for (let tries = 0; !DATA; tries++) {
      try { DATA = await (await fetch("/data.json")).json(); }
      catch (e) { await new Promise(r => setTimeout(r, 1500)); }
    }
    makeUI();
    let useSse = false;
    try { useSse = (await (await fetch("/state", { cache: "no-store" })).json()).sse; } catch (e) {}
    if (useSse) sse();
    setInterval(poll, useSse ? 4000 : 2000);        // cloudflare doesnt do SSE so just poll
    setInterval(readouts, 500);
    requestAnimationFrame(frame);
  }
  boot();
})();
</script>
